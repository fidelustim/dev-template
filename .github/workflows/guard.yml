name: Guard (gitflow)

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  via-pull-request:
    name: Коммит пришёл через PR
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что пуш сделан через Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          count=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length' 2>/dev/null || echo 0)
          if [ "$count" = "0" ]; then
            echo "::error::Прямой пуш в $BRANCH без Pull Request. Процесс: ветка feature/<ID>-<имя> → PR → merge."
            exit 1
          fi
          echo "OK: коммит связан с Pull Request."
